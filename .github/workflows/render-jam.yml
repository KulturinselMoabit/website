name: Render jam data into HTML

on:
  push:
    branches: [ "main" ]
    paths:
      - "data/jam.json"
      - "scripts/render_jam.py"
      - "index.html"
      - "jam/index.html"
      - ".github/workflows/render-jam.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render placeholders
        run: python scripts/render_jam.py

      - name: Commit changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html jam/index.html
          git commit -m "Render jam data"
          git push
